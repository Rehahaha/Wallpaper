name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wallpaper.slnx

      - name: Build
        run: dotnet build Wallpaper.slnx -c Release --no-restore -warnaserror

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-bin
          path: src/Wallpaper.App/bin/Release/net10.0-windows/
